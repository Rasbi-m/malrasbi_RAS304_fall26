site_name: RAS 304 Mohammed Al Rasbi Data Sheet
site_url: https://rasbi-m.github.io/malrasbi_RAS304_fall26/
repo_url: https://github.com/rasbi-m/malrasbi_RAS304_fall26
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: custom_theme/
  palette:
    scheme: slate
    primary: blue
    accent: black
  font:
    text: Roboto
  logo: static/logo304.svg
  favicon: static/logo304.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow    
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer
#    - navigation.sections
#    - navigation.expand
#    - navigation.instant # doesn't work that well

markdown_extensions:
  - attr_list #add attributes using curly brackets to images, see https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html # see https://squidfunk.github.io/mkdocs-material/reference/images/
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**
  
plugins:
  - search

extra_css:
  - stylesheets/extra.css  

extra_javascript:
 - javascripts/mathjax.js
 - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    
not_in_nav: |
  static
  
copyright: "Copyright &copy; 2026 Mohammed Al Rasbi"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: https://ras304-f26-105.github.io/RAS304-F26-105/
      name: Team 105

nav:
  - Home: index.md
  - Block Diagram: 01-Block-Diagram/Block-Diagram.md
  - Component Selection: 02-Component-Selection/Component-Selection.md
  - Bill of Materials: 03-BOM/BOM.md
  - Schematic: 04-Schematic/schematic.md
  - Power Budget: 05-Power-Budget/Power-Budget.md
